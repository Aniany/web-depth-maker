<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="coreWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- 圆角暗夜外壳 -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)" stroke="url(#border)" stroke-width="3" />

  <!-- 3D 等距空间深度棱柱 (Isometric Depth Prism) -->
  <!-- 顶面 (近景 - 极光青白高光) -->
  <polygon points="64,22 102,44 64,66 26,44" fill="url(#topFace)" />

  <!-- 左面 (深景 - 深邃暗夜紫蓝) -->
  <polygon points="26,44 64,66 64,106 26,84" fill="url(#leftFace)" />

  <!-- 右面 (中景 - 钴蓝饱和过渡) -->
  <polygon points="102,44 64,66 64,106 102,84" fill="url(#rightFace)" />

  <!-- 内部立体深度切片等高线 (内嵌 3D 景深层次) -->
  <!-- 顶面阶梯切线 -->
  <polyline points="38,37 64,52 90,37" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <polyline points="48,31 64,40 80,31" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- 正中深度轴心高光脊线 -->
  <line x1="64" y1="22" x2="64" y2="106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />

  <!-- 右侧阶梯层次线 -->
  <line x1="64" y1="80" x2="102" y2="58" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <line x1="64" y1="94" x2="102" y2="72" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- 左侧阶梯层次线 -->
  <line x1="26" y1="58" x2="64" y2="80" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <line x1="26" y1="72" x2="64" y2="94" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- 顶点璀璨激光测距光星 (Depth LiDAR Focal Point) -->
  <circle cx="64" cy="22" r="4.5" fill="#ffffff" />
  <circle cx="64" cy="22" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
</svg>